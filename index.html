<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Daily Odds - Premium Betting Tips</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-green: #00ff88;
            --accent-gold: #ffb700;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #2a3447;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--accent-gold);
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .ticket-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid var(--accent-green);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: center;
        }

        .ticket-card .price {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-green);
            margin: 10px 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-green);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .status-msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .status-success {
            background-color: rgba(0, 255, 136, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .status-error {
            background-color: rgba(255, 0, 0, 0.1);
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Apex Daily Odds</h1>
            <p>Instant Ticket Access Portal</p>
        </div>

        <div class="ticket-card">
            <h3>2+ Daily Rollover Ticket</h3>
            <div class="price">₦2,000</div>
            <p style="color: #94a3b8; font-size: 13px;">Guaranteed safe selection • Direct booking code release</p>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="telegramUser">Telegram Username / Phone</label>
                <input type="text" id="telegramUser" placeholder="@username or 080..." required>
            </div>

            <div class="form-group">
                <label for="paymentRef">Payment Reference / Transaction ID</label>
                <input type="text" id="paymentRef" placeholder="Paste bank transfer reference code" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Payment Verification</button>
        </form>

        <div id="statusBox" class="status-msg"></div>
    </div>

    <script>
        // Automatic dynamic backend URL detection
        const BACKEND_URL = window.location.origin + '/api/checkout';

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');

            const payload = {
                name: document.getElementById('fullName').value,
                telegram: document.getElementById('telegramUser').value,
                reference: document.getElementById('paymentRef').value,
                amount: '2000'
            };

            submitBtn.disabled = true;
            submitBtn.innerText = "Processing Notification...";
            statusBox.style.display = "none";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success) {
                    statusBox.className = "status-msg status-success";
                    statusBox.innerText = "Payment submitted! Admin notified on Telegram. Your booking code will be sent shortly.";
                    statusBox.style.display = "block";
                    document.getElementById('paymentForm').reset();
                } else {
                    throw new Error(result.message || "Failed to submit request.");
                }
            } catch (err) {
                statusBox.className = "status-msg status-error";
                statusBox.innerText = "Error sending payment details. Please try again or contact support.";
                statusBox.style.display = "block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Payment Verification";
            }
        });
    </script>
</body>
</html>
